[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evocoup"
version = "0.1.0"
description = "A faithful Coup rules engine and LLM game sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "openai>=2.21",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "httpx>=0.27",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evocoup"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not long'"
testpaths = ["tests"]
markers = ["long: exhaustive local stress tests excluded from the ordinary suite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
